name: Build Embedded

on:
  push:
    paths:
      - '**.c'
      - '**.h'
      - 'CMakeLists.txt'
      - 'library.json*'
      - 'library.properties*'
      - 'idf_component.yml*'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.c'
      - '**.h'
      - 'CMakeLists.txt'
      - 'library.json*'
      - 'library.properties*'
      - 'idf_component.yml*'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  espidf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scaffold project and build md4c as a component
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: esp32
          command: |
            idf.py create-project smoke \
              && mkdir -p smoke/components \
              && ln -s ../.. smoke/components/md4c \
              && cd smoke \
              && idf.py build

  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Compile md4c with the ESP-IDF framework
        run: pio ci test/embedded/smoke.cpp --board=esp32dev --lib=. -O framework=espidf -O build_unflags=-fuse-cxa-atexit

      - name: Compile md4c with the Arduino framework
        run: pio ci test/embedded/smoke.cpp --board=esp32dev --lib=. -O framework=arduino